# Production stack for a single VPS: Postgres + engine + API.
# The API binds to localhost only; expose it through a reverse proxy with TLS (see deploy/README.md).
# Only the engine reads .env (it needs the Binance and Telegram secrets); the api and migrate
# services receive just the variables they use.
x-node: &node
  build: .
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: trader
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader"]
      interval: 5s
      retries: 10

  migrate:
    <<: *node
    environment:
      MODE: ${MODE:-paper}
      DATABASE_URL: postgres://trader:${POSTGRES_PASSWORD}@db:5432/trader
    command: ["node", "dist/cli/migrate.js"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  engine:
    <<: *node
    env_file: .env
    environment:
      DATABASE_URL: postgres://trader:${POSTGRES_PASSWORD}@db:5432/trader
      # Not secrets of the engine: keep them out of its environment even though .env has them.
      API_TOKEN: ""
      POSTGRES_PASSWORD: ""
    command: ["node", "dist/cli/engine.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      # Unhealthy when no tick has succeeded for 5 minutes (the engine touches this file after each one).
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/engine-heartbeat');process.exit(Date.now()-s.mtimeMs<300000?0:1)"]
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 3m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  api:
    <<: *node
    environment:
      MODE: ${MODE:-paper}
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env}
      DATABASE_URL: postgres://trader:${POSTGRES_PASSWORD}@db:5432/trader
    command: ["node", "dist/cli/api.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped

volumes:
  pgdata:
