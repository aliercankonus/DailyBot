# Production stack for a single VPS: Postgres + engine + API.
# The API binds to localhost only; expose it through a reverse proxy with TLS (see deploy/README.md).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: trader
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://trader:${POSTGRES_PASSWORD}@db:5432/trader
    command: ["node", "dist/cli/migrate.js"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  engine:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://trader:${POSTGRES_PASSWORD}@db:5432/trader
    command: ["node", "dist/cli/engine.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://trader:${POSTGRES_PASSWORD}@db:5432/trader
    command: ["node", "dist/cli/api.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
