# Deployable as-is through the Hostinger Docker manager (no build context, no bind mounts).
# The image is built and pushed to GHCR by .github/workflows/ci.yml on every push to main.
# Required project environment: POSTGRES_PASSWORD, API_TOKEN. Everything else has safe defaults
# (MODE=paper: live public market data, simulated account, no API keys).
# Before testnet/live, pin IMAGE_TAG to a commit sha tag (see .env.example).
#
# Port 8080 on this VPS belongs to signal-desk; this project's APIs use 127.0.0.1:8081 (engine A),
# 8082 (engine-st = GC) and 8083 (engine-gls = TS).
#
# Service names are kept from phase 1 (Hostinger cannot remove renamed services' old containers):
# engine = A, engine-st = GC, engine-gls = TS (round 12, BTC/ETH portfolio).
#
# Each service only receives the variables it needs: Binance and Telegram secrets go to the
# engine only, API_TOKEN to the api only, and research gets nothing secret.

x-node: &node
  image: ghcr.io/aliercankonus/dailybot:${IMAGE_TAG:-main}
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-db-url: &dburl postgres://trader:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/trader
# A_DB: engine A database (set A_DB=trader_a_testnet for testnet so paper state such as the equity peak does not carry over).
x-db-a: &db_a postgres://trader:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${A_DB:-trader_a}
x-db-gc: &db_gc postgres://trader:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/trader_gc
x-db-ts: &db_ts postgres://trader:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/trader_ts

# Shared engine settings; each engine adds its own strategy, account and limits.
x-engine-env: &engine_env
  REGISTRY_DATABASE_URL: *dburl
  BINANCE_STOP_API: ${BINANCE_STOP_API:-auto}
  SYMBOLS: BTCUSDT,ETHUSDT
  MAX_LEVERAGE: ${MAX_LEVERAGE:-3}
  MAX_OPEN_POSITIONS: 2
  DAILY_LOSS_LIMIT: ${DAILY_LOSS_LIMIT:-0.03}
  TAKER_FEE: ${TAKER_FEE:-0.0005}
  SLIPPAGE: ${SLIPPAGE:-0.0005}
  TICK_SECONDS: ${TICK_SECONDS:-60}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}

x-engine-common: &engine_common
  command: ["node", "dist/cli/engine.js"]
  depends_on:
    migrate: { condition: service_completed_successfully }
  mem_limit: 384m
  restart: unless-stopped
  # The engine's own shutdown deadline is 45s; this leaves room for it to persist and exit.
  stop_grace_period: 60s
  healthcheck:
    # Unhealthy when no tick has succeeded for 5 minutes (the engine touches this file after each one).
    test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/engine-heartbeat');process.exit(Date.now()-s.mtimeMs<300000?0:1)"]
    interval: 60s
    timeout: 10s
    retries: 2
    start_period: 3m

x-api-common: &api_common
  command: ["node", "dist/cli/api.js"]
  depends_on:
    migrate: { condition: service_completed_successfully }
  mem_limit: 256m
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 30s
    timeout: 5s
    retries: 3

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: trader
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader"]
      interval: 5s
      retries: 20

  migrate:
    <<: *node
    command: ["node", "dist/cli/migrate.js"]
    environment:
      MODE: ${MODE:-paper}
      DATABASE_URL: *dburl
      # One database per engine instance (see below).
      EXTRA_DATABASES: trader_a,trader_gc,trader_ts,${A_DB:-trader_a}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  # BTC/ETH portfolio (PROGRESS.md round 12): 50% A, 25% GC, 25% TS of the capital, each engine
  # on its own database and, for testnet/live, its OWN Binance (sub-)account and keys (two engines
  # on one account would net their positions; engine_accounts refuses a reused key). Paper balances
  # are the planned live slices of ~2300 USDT. Each engine risks 1% of its own slice per trade.
  # MAX_DRAWDOWN is a "something is broken" kill switch above each backtest drawdown
  # (A 18.9%, GC 39.4%, TS 14.6%). The old phase-1 databases (trader, trader_st, trader_gls) are kept.

  # A-LV + time stop: 4h breakout.
  engine:
    <<: [*node, *engine_common]
    environment:
      <<: *engine_env
      BOT_NAME: A
      HEALTHCHECK_URL: ${A_HEALTHCHECK_URL:-}
      MODE: ${MODE:-paper}
      CONFIRM_LIVE: ${CONFIRM_LIVE:-}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      BINANCE_BASE_URL: ${BINANCE_BASE_URL:-}
      STRATEGY: trendlv+timestop+befee
      RISK_PER_TRADE: ${A_RISK_PER_TRADE:-0.01}
      MAX_DRAWDOWN: ${A_MAX_DRAWDOWN:-0.30}
      PAPER_START_BALANCE: ${A_PAPER_START_BALANCE:-1150}
      DATABASE_URL: *db_a

  # GC: golden cross (EMA50/200) on 1h candles; stop moves to entry once the trade reaches 2R (be2).
  engine-st:
    <<: [*node, *engine_common]
    environment:
      <<: *engine_env
      BOT_NAME: GC
      HEALTHCHECK_URL: ${GC_HEALTHCHECK_URL:-}
      MODE: ${GC_MODE:-paper}
      CONFIRM_LIVE: ${GC_CONFIRM_LIVE:-}
      BINANCE_API_KEY: ${GC_BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${GC_BINANCE_API_SECRET:-}
      BINANCE_BASE_URL: ${GC_BINANCE_BASE_URL:-}
      STRATEGY: gcross1h+be2
      RISK_PER_TRADE: ${GC_RISK_PER_TRADE:-0.01}
      MAX_DRAWDOWN: ${GC_MAX_DRAWDOWN:-0.50}
      PAPER_START_BALANCE: ${GC_PAPER_START_BALANCE:-575}
      DATABASE_URL: *db_gc

  # TS: time-series momentum on 4h candles, long only.
  engine-gls:
    <<: [*node, *engine_common]
    environment:
      <<: *engine_env
      BOT_NAME: TS
      HEALTHCHECK_URL: ${TS_HEALTHCHECK_URL:-}
      MODE: ${TS_MODE:-paper}
      CONFIRM_LIVE: ${TS_CONFIRM_LIVE:-}
      BINANCE_API_KEY: ${TS_BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${TS_BINANCE_API_SECRET:-}
      BINANCE_BASE_URL: ${TS_BINANCE_BASE_URL:-}
      STRATEGY: tsmom4h
      RISK_PER_TRADE: ${TS_RISK_PER_TRADE:-0.01}
      MAX_DRAWDOWN: ${TS_MAX_DRAWDOWN:-0.25}
      PAPER_START_BALANCE: ${TS_PAPER_START_BALANCE:-575}
      DATABASE_URL: *db_ts

  api:
    <<: [*node, *api_common]
    environment:
      MODE: ${MODE:-paper}
      API_TOKEN: ${API_TOKEN:?set API_TOKEN}
      DATABASE_URL: *db_a
    ports:
      - "127.0.0.1:8081:8080"

  # One API per engine database: status, equity and the kill switch of each engine.
  api-st:
    <<: [*node, *api_common]
    environment:
      MODE: ${MODE:-paper}
      API_TOKEN: ${API_TOKEN:?set API_TOKEN}
      DATABASE_URL: *db_gc
    ports:
      - "127.0.0.1:8082:8080"

  api-gls:
    <<: [*node, *api_common]
    environment:
      MODE: ${MODE:-paper}
      API_TOKEN: ${API_TOKEN:?set API_TOKEN}
      DATABASE_URL: *db_ts
    ports:
      - "127.0.0.1:8083:8080"

  # Opt-in key release: RELEASE_BOT=<BOT_NAME> removes that engine's engine_accounts row (e.g. after
  # moving an engine to a new database); the engine registers again on its next start. Unset it after.
  release:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      RELEASE_BOT: ${RELEASE_BOT:-}
    command:
      - sh
      - -c
      - >-
        if [ -z "$${RELEASE_BOT}" ]; then echo "release skipped"; exit 0; fi;
        echo "DELETE FROM engine_accounts WHERE bot_name = :'bot';" | psql -h db -U trader -d trader -v ON_ERROR_STOP=1 -v bot="$${RELEASE_BOT}"
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  # Research data: Binance USD-M forced liquidations for BTC/ETH (public stream, no key) into the
  # main database, for the liquidation-cascade test (PROGRESS.md). Never trades.
  # One-shot repair of engine A positions recorded without fill prices, from Binance trade history
  # (read-only on Binance). REPAIR=dry prints, REPAIR=apply writes; unset = skipped. Unset it afterwards.
  repair:
    <<: *node
    command: ["node", "dist/cli/repairTrades.js"]
    environment:
      REPAIR: ${REPAIR:-}
      MODE: ${MODE:-paper}
      DATABASE_URL: *db_a
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      BINANCE_BASE_URL: ${BINANCE_BASE_URL:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 128m
    restart: "no"

  liquidations:
    <<: *node
    command: ["node", "dist/cli/liquidations.js"]
    environment:
      DATABASE_URL: *dburl
      LIQ_SYMBOLS: BTCUSDT,ETHUSDT
      LIQ_WS_BASE: ${LIQ_WS_BASE:-wss://fstream.binance.com/market}
      LIQ_CONTROL: "1"
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/collector-heartbeat');process.exit(Date.now()-s.mtimeMs<300000?0:1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 3m

  # Operations dashboard (read-only; HTTP Basic auth when DASHBOARD_PASSWORD is set, open when empty) for all engines, served over HTTPS by the
  # traefik project (Let's Encrypt) at DASHBOARD_HOST; also on 127.0.0.1:8090 for an SSH tunnel.
  dashboard:
    <<: [*node, *api_common]
    command: ["node", "dist/cli/dashboard.js"]
    environment:
      DASHBOARD_USER: ${DASHBOARD_USER:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      DASH_DB_A: *db_a
      DASH_DB_GC: *db_gc
      DASH_DB_TS: *db_ts
      DASH_MODE_A: ${MODE:-paper}
      DASH_MODE_GC: ${GC_MODE:-paper}
      DASH_MODE_TS: ${TS_MODE:-paper}
      DASH_STRATEGY_A: trendlv+timestop+befee
      DASH_STRATEGY_GC: gcross1h+be2
      DASH_STRATEGY_TS: tsmom4h
    labels:
      - traefik.enable=true
      - traefik.http.routers.dailybot.rule=Host(`${DASHBOARD_HOST:-srv1955523.hstgr.cloud}`)
      - traefik.http.routers.dailybot.entrypoints=websecure
      - traefik.http.routers.dailybot.tls.certresolver=letsencrypt
      - traefik.http.services.dailybot.loadbalancer.server.port=8080
    ports:
      - "127.0.0.1:8090:8080"

  # Research runs in Claude sessions on the data.binance.vision archive (PROGRESS.md), not on the VPS.
  report:
    <<: *node
    environment:
      REPORT: ${REPORT:-0}
      REPORT_DB_A: *db_a
      REPORT_DB_GC: *db_gc
      REPORT_DB_TS: *db_ts
    command:
      - sh
      - -c
      - >-
        if [ "$${REPORT}" != "1" ]; then echo "report skipped (set REPORT=1 to run)"; exit 0; fi;
        node dist/cli/paperReport.js
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 256m
    restart: "no"

volumes:
  pgdata:
