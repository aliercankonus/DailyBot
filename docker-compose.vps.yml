# Deployable as-is through the Hostinger Docker manager (no build context, no bind mounts).
# The image is built and pushed to GHCR by .github/workflows/ci.yml on every push to main.
# Required project environment: POSTGRES_PASSWORD, API_TOKEN. Everything else has safe defaults
# (MODE=paper: live public market data, simulated account, no API keys).
# Before testnet/live, pin IMAGE_TAG to a commit sha tag (see .env.example).
#
# Port 8080 on this VPS belongs to signal-desk; this project's API uses 127.0.0.1:8081.
#
# Each service only receives the variables it needs: Binance and Telegram secrets go to the
# engine only, API_TOKEN to the api only, and research gets nothing secret.

x-node: &node
  image: ghcr.io/aliercankonus/dailybot:${IMAGE_TAG:-main}
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-db-url: &dburl postgres://trader:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/trader

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: trader
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader"]
      interval: 5s
      retries: 20

  migrate:
    <<: *node
    command: ["node", "dist/cli/migrate.js"]
    environment:
      MODE: ${MODE:-paper}
      DATABASE_URL: *dburl
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  engine:
    <<: *node
    command: ["node", "dist/cli/engine.js"]
    environment:
      MODE: ${MODE:-paper}
      CONFIRM_LIVE: ${CONFIRM_LIVE:-}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      BINANCE_BASE_URL: ${BINANCE_BASE_URL:-}
      BINANCE_STOP_API: ${BINANCE_STOP_API:-auto}
      SYMBOLS: ${SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT}
      STRATEGY: ${STRATEGY:-trend}
      RISK_PER_TRADE: ${RISK_PER_TRADE:-0.005}
      MAX_LEVERAGE: ${MAX_LEVERAGE:-3}
      MAX_OPEN_POSITIONS: ${MAX_OPEN_POSITIONS:-3}
      DAILY_LOSS_LIMIT: ${DAILY_LOSS_LIMIT:-0.03}
      MAX_DRAWDOWN: ${MAX_DRAWDOWN:-0.15}
      PAPER_START_BALANCE: ${PAPER_START_BALANCE:-10000}
      TAKER_FEE: ${TAKER_FEE:-0.0005}
      SLIPPAGE: ${SLIPPAGE:-0.0005}
      TICK_SECONDS: ${TICK_SECONDS:-60}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DATABASE_URL: *dburl
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 384m
    restart: unless-stopped
    # The engine's own shutdown deadline is 45s; this leaves room for it to persist and exit.
    stop_grace_period: 60s
    healthcheck:
      # Unhealthy when no tick has succeeded for 5 minutes (the engine touches this file after each one).
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/engine-heartbeat');process.exit(Date.now()-s.mtimeMs<300000?0:1)"]
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 3m

  api:
    <<: *node
    command: ["node", "dist/cli/api.js"]
    environment:
      MODE: ${MODE:-paper}
      API_TOKEN: ${API_TOKEN:?set API_TOKEN}
      DATABASE_URL: *dburl
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:8081:8080"
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Opt-in research job: set RESEARCH=1 in the project environment, then update the project.
  # It downloads 4h/1h candles (5 coins), 1d candles and funding history (20 coins) from 2021,
  # prints a backtest report per strategy to its logs
  # then the RESEARCH_COMBO portfolios (RESEARCH_STRATEGIES=none skips single runs),
  # and exits 0 if at least one strategy passed the acceptance gate, 2 otherwise. With RESEARCH unset it logs "research skipped" and exits 0.
  research:
    <<: *node
    environment:
      RESEARCH: ${RESEARCH:-0}
      RESEARCH_STRATEGIES: ${RESEARCH_STRATEGIES:-donchian carry tsmom xsmom btchold ewhold}
      RESEARCH_ARGS: ${RESEARCH_ARGS:-}
      # Space-separated portfolios of comma-separated name:weight legs, e.g. "trend:0.5,donchianls:0.5".
      RESEARCH_COMBO: ${RESEARCH_COMBO:-}
      RESEARCH_UNIVERSE: ${RESEARCH_UNIVERSE:-BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,LTCUSDT,BCHUSDT,TRXUSDT,ATOMUSDT,ETCUSDT,XLMUSDT,FILUSDT,UNIUSDT,NEARUSDT,AAVEUSDT}
    command:
      - sh
      - -c
      - >-
        if [ "$${RESEARCH}" != "1" ]; then echo "research skipped (set RESEARCH=1 to run)"; exit 0; fi;
        U=$${RESEARCH_UNIVERSE};
        node dist/cli/download.js --interval 4h --from 2021-01-01 --dir /data &&
        node dist/cli/download.js --interval 1h --from 2021-01-01 --dir /data &&
        node dist/cli/download.js --interval 1d --from 2020-01-01 --dir /data --symbols $$U &&
        node dist/cli/download.js --funding --from 2020-01-01 --dir /data --symbols $$U || exit 1;
        best=2;
        for s in $${RESEARCH_STRATEGIES}; do
          if [ "$$s" = "none" ]; then continue; fi;
          echo "==================== strategy $$s ====================";
          node dist/cli/backtest.js --strategy $$s --split 2025-01-01 --dir /data --robustness $${RESEARCH_ARGS};
          rc=$$?; echo "strategy $$s finished with exit code $$rc";
          if [ $$rc -eq 0 ]; then best=0; fi;
        done;
        for c in $${RESEARCH_COMBO}; do
          echo "==================== portfolio $$c ====================";
          node dist/cli/combo.js --legs $$c --split 2025-01-01 --dir /data;
        done;
        echo "research finished with exit code $$best (0 = at least one strategy passed)"; exit $$best
    volumes:
      - research:/data
    mem_limit: 768m
    cpus: 0.75
    restart: "no"

volumes:
  pgdata:
  research:
