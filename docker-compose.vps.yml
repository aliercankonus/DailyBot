# Deployable as-is through the Hostinger Docker manager (no build context, no bind mounts).
# The image is built and pushed to GHCR by .github/workflows/ci.yml on every push to main.
# Required project environment: POSTGRES_PASSWORD, API_TOKEN. Everything else has safe defaults
# (MODE=paper: live public market data, simulated account, no API keys).
# Before testnet/live, pin IMAGE_TAG to a commit sha tag (see .env.example).
#
# Port 8080 on this VPS belongs to signal-desk; this project's APIs use 127.0.0.1:8081 (engine A),
# 8082 (engine-st) and 8083 (engine-gls).
#
# Each service only receives the variables it needs: Binance and Telegram secrets go to the
# engine only, API_TOKEN to the api only, and research gets nothing secret.

x-node: &node
  image: ghcr.io/aliercankonus/dailybot:${IMAGE_TAG:-main}
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-db-url: &dburl postgres://trader:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/trader
x-db-url-st: &dburl_st postgres://trader:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/trader_st
x-db-url-gls: &dburl_gls postgres://trader:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/trader_gls

x-engine-common: &engine_common
  command: ["node", "dist/cli/engine.js"]
  depends_on:
    migrate: { condition: service_completed_successfully }
  mem_limit: 384m
  restart: unless-stopped
  # The engine's own shutdown deadline is 45s; this leaves room for it to persist and exit.
  stop_grace_period: 60s
  healthcheck:
    # Unhealthy when no tick has succeeded for 5 minutes (the engine touches this file after each one).
    test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/engine-heartbeat');process.exit(Date.now()-s.mtimeMs<300000?0:1)"]
    interval: 60s
    timeout: 10s
    retries: 2
    start_period: 3m

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: trader
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader"]
      interval: 5s
      retries: 20

  migrate:
    <<: *node
    command: ["node", "dist/cli/migrate.js"]
    environment:
      MODE: ${MODE:-paper}
      DATABASE_URL: *dburl
      # One database per engine instance (see below).
      EXTRA_DATABASES: trader_st,trader_gls
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  # Three engines, one per strategy of the recommended portfolio (PROGRESS.md round 10). Each has
  # its own database: own positions, paper account, kill switch and equity curve. For testnet/live
  # each needs its OWN Binance (sub-)account and keys, because two engines trading the same symbol
  # on one account would net their positions; that is why the extra engines have separate
  # *_MODE, key and base-URL variables, and every testnet/live engine registers a fingerprint of its
  # key in the main database (engine_accounts) and refuses to start if another engine has it.
  # MAX_DRAWDOWN is a kill switch for "something is broken", set above
  # each strategy's backtest drawdown (A 31.8%, ST 19.7%, G-LS 32.6%).

  # A-LV + time stop: 4h breakout on 5 coins.
  engine:
    <<: [*node, *engine_common]
    environment:
      BOT_NAME: A
      MODE: ${MODE:-paper}
      REGISTRY_DATABASE_URL: *dburl
      CONFIRM_LIVE: ${CONFIRM_LIVE:-}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      BINANCE_BASE_URL: ${BINANCE_BASE_URL:-}
      BINANCE_STOP_API: ${BINANCE_STOP_API:-auto}
      SYMBOLS: ${SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT}
      STRATEGY: ${STRATEGY:-trendlv+timestop}
      RISK_PER_TRADE: ${RISK_PER_TRADE:-0.005}
      MAX_LEVERAGE: ${MAX_LEVERAGE:-3}
      MAX_OPEN_POSITIONS: ${MAX_OPEN_POSITIONS:-3}
      DAILY_LOSS_LIMIT: ${DAILY_LOSS_LIMIT:-0.03}
      MAX_DRAWDOWN: ${A_MAX_DRAWDOWN:-0.35}
      PAPER_START_BALANCE: ${PAPER_START_BALANCE:-10000}
      TAKER_FEE: ${TAKER_FEE:-0.0005}
      SLIPPAGE: ${SLIPPAGE:-0.0005}
      TICK_SECONDS: ${TICK_SECONDS:-60}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DATABASE_URL: *dburl

  # Supertrend(10,3) daily on 20 coins.
  engine-st:
    <<: [*node, *engine_common]
    environment:
      BOT_NAME: ST
      MODE: ${ST_MODE:-paper}
      REGISTRY_DATABASE_URL: *dburl
      CONFIRM_LIVE: ${ST_CONFIRM_LIVE:-}
      BINANCE_API_KEY: ${ST_BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${ST_BINANCE_API_SECRET:-}
      BINANCE_BASE_URL: ${ST_BINANCE_BASE_URL:-}
      BINANCE_STOP_API: ${BINANCE_STOP_API:-auto}
      SYMBOLS: ${UNIVERSE_20:-BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,LTCUSDT,BCHUSDT,TRXUSDT,ATOMUSDT,ETCUSDT,XLMUSDT,FILUSDT,UNIUSDT,NEARUSDT,AAVEUSDT}
      STRATEGY: st1d
      RISK_PER_TRADE: ${ST_RISK_PER_TRADE:-0.005}
      MAX_LEVERAGE: ${MAX_LEVERAGE:-3}
      MAX_OPEN_POSITIONS: 10
      DAILY_LOSS_LIMIT: ${DAILY_LOSS_LIMIT:-0.03}
      MAX_DRAWDOWN: ${ST_MAX_DRAWDOWN:-0.25}
      PAPER_START_BALANCE: ${PAPER_START_BALANCE:-10000}
      TAKER_FEE: ${TAKER_FEE:-0.0005}
      SLIPPAGE: ${SLIPPAGE:-0.0005}
      TICK_SECONDS: ${TICK_SECONDS:-60}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DATABASE_URL: *dburl_st

  # G-LS: daily Donchian ensemble, long/short, volatility targeted, rebalanced after each daily close.
  engine-gls:
    <<: [*node, *engine_common]
    environment:
      BOT_NAME: GLS
      MODE: ${GLS_MODE:-paper}
      REGISTRY_DATABASE_URL: *dburl
      CONFIRM_LIVE: ${GLS_CONFIRM_LIVE:-}
      BINANCE_API_KEY: ${GLS_BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${GLS_BINANCE_API_SECRET:-}
      BINANCE_BASE_URL: ${GLS_BINANCE_BASE_URL:-}
      BINANCE_STOP_API: ${BINANCE_STOP_API:-auto}
      SYMBOLS: ${UNIVERSE_20:-BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,LTCUSDT,BCHUSDT,TRXUSDT,ATOMUSDT,ETCUSDT,XLMUSDT,FILUSDT,UNIUSDT,NEARUSDT,AAVEUSDT}
      STRATEGY: donchianls
      MAX_LEVERAGE: ${MAX_LEVERAGE:-3}
      MAX_DRAWDOWN: ${GLS_MAX_DRAWDOWN:-0.40}
      PAPER_START_BALANCE: ${PAPER_START_BALANCE:-10000}
      TAKER_FEE: ${TAKER_FEE:-0.0005}
      SLIPPAGE: ${SLIPPAGE:-0.0005}
      TICK_SECONDS: ${TICK_SECONDS:-60}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DATABASE_URL: *dburl_gls

  api:
    <<: *node
    command: ["node", "dist/cli/api.js"]
    environment:
      MODE: ${MODE:-paper}
      API_TOKEN: ${API_TOKEN:?set API_TOKEN}
      DATABASE_URL: *dburl
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:8081:8080"
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # One API per engine database: status, equity and the kill switch of each engine.
  api-st:
    <<: *node
    command: ["node", "dist/cli/api.js"]
    environment:
      MODE: ${MODE:-paper}
      API_TOKEN: ${API_TOKEN:?set API_TOKEN}
      DATABASE_URL: *dburl_st
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:8082:8080"
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  api-gls:
    <<: *node
    command: ["node", "dist/cli/api.js"]
    environment:
      MODE: ${MODE:-paper}
      API_TOKEN: ${API_TOKEN:?set API_TOKEN}
      DATABASE_URL: *dburl_gls
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:8083:8080"
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Opt-in research job: set RESEARCH=1 in the project environment, then update the project.
  # It downloads 4h/1h candles (5 coins), 1d candles and funding history (20 coins) from 2021,
  # prints a backtest report per strategy to its logs
  # then the RESEARCH_COMBO portfolios (RESEARCH_STRATEGIES=none skips single runs),
  # and exits 0 if at least one strategy passed the acceptance gate, 2 otherwise. With RESEARCH unset it logs "research skipped" and exits 0.
  research:
    <<: *node
    environment:
      RESEARCH: ${RESEARCH:-0}
      RESEARCH_STRATEGIES: ${RESEARCH_STRATEGIES:-donchian carry tsmom xsmom btchold ewhold}
      RESEARCH_ARGS: ${RESEARCH_ARGS:-}
      # Space-separated portfolios of comma-separated name:weight legs, e.g. "trend:0.5,donchianls:0.5".
      RESEARCH_COMBO: ${RESEARCH_COMBO:-}
      RESEARCH_UNIVERSE: ${RESEARCH_UNIVERSE:-BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,LTCUSDT,BCHUSDT,TRXUSDT,ATOMUSDT,ETCUSDT,XLMUSDT,FILUSDT,UNIUSDT,NEARUSDT,AAVEUSDT}
    command:
      - sh
      - -c
      - >-
        if [ "$${RESEARCH}" != "1" ]; then echo "research skipped (set RESEARCH=1 to run)"; exit 0; fi;
        U=$${RESEARCH_UNIVERSE};
        node dist/cli/download.js --interval 4h --from 2021-01-01 --dir /data &&
        node dist/cli/download.js --interval 1h --from 2021-01-01 --dir /data &&
        node dist/cli/download.js --interval 1d --from 2020-01-01 --dir /data --symbols $$U &&
        node dist/cli/download.js --funding --from 2020-01-01 --dir /data --symbols $$U || exit 1;
        best=2;
        for s in $${RESEARCH_STRATEGIES}; do
          if [ "$$s" = "none" ]; then continue; fi;
          echo "==================== strategy $$s ====================";
          node dist/cli/backtest.js --strategy $$s --split 2025-01-01 --dir /data --robustness $${RESEARCH_ARGS};
          rc=$$?; echo "strategy $$s finished with exit code $$rc";
          if [ $$rc -eq 0 ]; then best=0; fi;
        done;
        for c in $${RESEARCH_COMBO}; do
          echo "==================== portfolio $$c ====================";
          node dist/cli/combo.js --legs $$c --split 2025-01-01 --dir /data;
        done;
        echo "research finished with exit code $$best (0 = at least one strategy passed)"; exit $$best
    volumes:
      - research:/data
    mem_limit: 768m
    cpus: 0.75
    restart: "no"

  # Opt-in paper-vs-backtest report: set REPORT=1 and update the project; it prints one block per
  # engine (equity, drawdown, trades, PF, R, errors, kill switch, deviations from the backtest).
  report:
    <<: *node
    environment:
      REPORT: ${REPORT:-0}
      REPORT_DB_A: *dburl
      REPORT_DB_ST: *dburl_st
      REPORT_DB_GLS: *dburl_gls
    command:
      - sh
      - -c
      - >-
        if [ "$${REPORT}" != "1" ]; then echo "report skipped (set REPORT=1 to run)"; exit 0; fi;
        node dist/cli/paperReport.js
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 256m
    restart: "no"

volumes:
  pgdata:
  research:
